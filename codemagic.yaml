# Codemagic CI/CD — LiDAR Pro Scanner
# Bina Apple ID ke .app build! (sign nahi ho sakta bina account ke)

workflows:
  ios-build:
    name: "iOS Build (no codesign)"
    instance_type: mac_mini_m2
    
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    
    cache:
      cache_paths:
        - ~/.pub-cache
    
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
        - pattern: develop
          include: true
    
    scripts:
      - name: Install Dependencies
        script: |
          flutter pub get
          flutter pub run build_runner build --delete-conflicting-outputs || true
      
      - name: Build .ipa (no codesign)
        script: |
          VERSION=$(grep '^version: ' pubspec.yaml | cut -d' ' -f2 | cut -d'+' -f1)
          BN=$(date +%Y%m%d%H%M)
          
          flutter build ipa --release --no-codesign \
            --build-name=${VERSION:-1.0.0} \
            --build-number=${BN:-1}
          
          # .xcarchive se .ipa banao
          APP_PATH=$(find build/ios/archive -name "*.xcarchive" | head -1)
          APP_BUNDLE=$(find "$APP_PATH/Products/Applications" -name "*.app" | head -1)
          
          mkdir -p build/ios/ipa/Payload
          cp -r "$APP_BUNDLE" build/ios/ipa/Payload/
          
          cd build/ios/ipa
          zip -r "LidarProScanner_${VERSION:-1.0.0}_${BN}.ipa" Payload/
          rm -rf Payload/
          
          echo "✅ IPA ready: LidarProScanner_${VERSION:-1.0.0}_${BN}.ipa"
    
    artifacts:
      - build/ios/ipa/*.ipa
      - build/ios/archive/*.xcarchive