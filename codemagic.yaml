# Codemagic CI/CD — LiDAR Pro Scanner
# Bina Apple ID ke .app build! (sign nahi ho sakta bina account ke)

workflows:
  ios-build:
    name: "iOS Build (no codesign)"
    instance_type: mac_mini_m2
    
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    
    cache:
      cache_paths:
        - ~/.pub-cache
    
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
        - pattern: develop
          include: true
    
    scripts:
      - name: Install Dependencies
        script: |
          flutter pub get
          flutter pub run build_runner build --delete-conflicting-outputs || true
      
      - name: Build iOS (no codesign)
        script: |
          flutter build ios --release --no-codesign
    
    artifacts:
      - build/ios/iphoneos/*.app
      - build/ios/iphoneos/Runner.app
