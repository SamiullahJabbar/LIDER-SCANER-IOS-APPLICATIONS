name: lidar_scanner_app
description: "LiDAR Pro Scanner - Professional 3D Scanning App"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.8
  
  # ARKit for LiDAR scanning (iOS only) - REAL AR IMPLEMENTATION
  arkit_plugin: ^1.0.7
  
  # ARCore for Android AR scanning - REAL AR IMPLEMENTATION
  # arcore_flutter_plugin: ^0.1.0  # Temporarily disabled due to namespace issue
  
  # Camera for fallback mode
  camera: ^0.10.5+5
  
  # Vector math for 3D calculations
  vector_math: ^2.1.4
  
  # 3D model viewing
  model_viewer_plus: ^1.9.2
  
  # HTTP client for API calls
  dio: ^5.4.0
  
  # Local storage
  sqflite: ^2.4.1
  path_provider: ^2.1.1
  shared_preferences: ^2.2.2
  
  # Secure storage for tokens
  flutter_secure_storage: ^9.0.0
  
  # State management
  provider: ^6.1.1
  
  # File handling
  path: ^1.9.1
  
  # Encryption
  encrypt: ^5.0.3
  
  # Permissions
  permission_handler: ^12.0.1
  
  # UUID generation
  uuid: ^4.2.2
  
  # JSON serialization
  json_annotation: ^4.11.0
  
  # Device info for detection
  device_info_plus: ^9.1.1
  
  # Device sensors (accelerometer, gyroscope) for real movement tracking
  sensors_plus: ^4.0.2
  
  # Onboarding
  smooth_page_indicator: ^2.0.1
  
  # Animations
  lottie: ^3.2.0
  animate_do: ^4.2.0
  
  # Icons
  flutter_svg: ^2.1.0
  
  # Image picker for profile
  image_picker: ^1.0.7

  # File sharing (OBJ / USDZ export from RealityKit)
  share_plus: ^10.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  
  # Code generation for JSON
  build_runner: ^2.4.13
  json_serializable: ^6.8.0
  
  # App icon generator
  flutter_launcher_icons: ^0.14.4

# Flutter Launcher Icons Configuration
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/icon.png"
  adaptive_icon_background: "#0A2463"
  adaptive_icon_foreground: "assets/icons/icon.png"

flutter:
  uses-material-design: true

  assets:
    - assets/icons/
